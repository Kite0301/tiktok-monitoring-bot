name: TikTok Monitor

on:
  schedule:
    # Hourly. */5 asked for 288 runs a day and only got 14-17, so asking once
    # an hour should land closer to what we ask for.
    #
    # :07 because 82% of the monitored accounts' posts go up exactly on the
    # hour -- checking early in the hour is what keeps detection lag small.
    # Not :00 itself: GitHub documents the top of the hour as a high-load
    # period for the scheduler. The odd minute also makes the delay
    # measurable, since every run's requested time is unambiguous.
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: tiktok-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Detect new posts and collect analytics
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/run.py
