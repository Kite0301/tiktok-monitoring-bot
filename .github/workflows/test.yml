name: Tests

on:
  pull_request:
  push:
    branches: [main]
    # The bot commits data/state.json on almost every run; those commits
    # cannot affect the tests, so don't spend a run on them.
    paths-ignore:
      - 'data/**'
      - '**.md'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
